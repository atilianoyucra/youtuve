<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlayRoom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #181818;
    --surface-2: #212121;
    --hover: #272727;
    --line: #303030;
    --text: #f1f1f1;
    --text-dim: #aaaaaa;
    --text-faint: #717171;
    --red: #ff0000;
    --topbar-h: 56px;
    --sidebar-w: 240px;
    --sidebar-w-collapsed: 72px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: calc(var(--topbar-h) + env(safe-area-inset-top,0px)); }
  body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Roboto', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }

  /* ---------- topbar ---------- */
  .topbar {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    left: 0; right: 0;
    height: var(--topbar-h);
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    gap: 16px;
    z-index: 30;
  }
  .topbar .left { display: flex; align-items: center; gap: 20px; min-width: 0; }
  .icon-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex: none;
  }
  .icon-btn:hover { background: var(--hover); }
  .icon-btn svg { width: 22px; height: 22px; }

  .logo {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
    user-select: none;
    white-space: nowrap;
  }
  .logo .play {
    width: 26px; height: 18px;
    background: var(--red);
    border-radius: 5px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-right: 2px;
  }
  .logo .play svg { width: 10px; height: 10px; fill: #fff; }

  .topbar .center {
    flex: 1;
    display: flex;
    justify-content: center;
    min-width: 0;
    max-width: 640px;
    margin: 0 auto;
  }
  .search { display: flex; width: 100%; height: 40px; }
  .search input {
    flex: 1;
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-right: none;
    border-radius: 20px 0 0 20px;
    padding: 0 16px;
    color: var(--text);
    font-size: 15px;
    outline: none;
  }
  .search input:focus { border-color: #1c62b9; }
  .search input::placeholder { color: var(--text-faint); }
  .search-btn {
    width: 64px;
    border-radius: 0 20px 20px 0;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .search-btn:hover { background: var(--hover); }
  .search-btn svg { width: 20px; height: 20px; }

  .topbar .right { display: flex; align-items: center; gap: 8px; flex: none; }
  .avatar-me {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: #7b4fd6;
    color: #fff;
    font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    margin-left: 6px;
    flex: none;
  }

  /* ---------- layout shell ---------- */
  .body-wrap {
    display: flex;
    padding-top: calc(var(--topbar-h) + env(safe-area-inset-top, 0px));
    min-height: 100%;
  }

  .sidebar {
    width: var(--sidebar-w);
    flex: none;
    padding: 12px;
    position: sticky;
    top: calc(var(--topbar-h) + env(safe-area-inset-top, 0px));
    height: calc(100vh - var(--topbar-h) - env(safe-area-inset-top, 0px));
    overflow-y: auto;
    transition: width .18s ease, transform .2s ease;
    z-index: 20;
    background: var(--bg);
  }
  .body-wrap.collapsed .sidebar { width: var(--sidebar-w-collapsed); }

  .nav-item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 20px;
    background: none;
    border: none;
    color: var(--text);
    text-align: left;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 2px;
  }
  .nav-item:hover { background: var(--hover); }
  .nav-item.active { background: var(--surface-2); font-weight: 500; }
  .nav-item svg { width: 22px; height: 22px; flex: none; }
  .nav-item span { white-space: nowrap; overflow: hidden; }
  .body-wrap.collapsed .nav-item { flex-direction: column; gap: 6px; padding: 14px 4px; font-size: 10px; border-radius: 8px; }
  .body-wrap.collapsed .nav-item span { font-size: 10px; }

  .sidebar hr { border: none; border-top: 1px solid var(--line); margin: 12px 4px; }

  .backdrop {
    display: none;
    position: fixed;
    inset: 0;
    top: calc(var(--topbar-h) + env(safe-area-inset-top, 0px));
    background: rgba(0,0,0,.5);
    z-index: 15;
  }

  main {
    flex: 1;
    min-width: 0;
    padding: 24px clamp(16px, 3vw, 40px) 60px;
  }
  .page-title { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
  .page-sub { color: var(--text-dim); font-size: 13px; margin: 0 0 24px; }
  .page-sub code { color: var(--text); background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 28px 16px;
  }

  .empty-search { color: var(--text-faint); font-size: 14px; padding: 40px 0; text-align: center; }

  /* ---------- card ---------- */
  .card {
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateY(8px);
    animation: rise .45s ease forwards;
  }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  .thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: var(--surface-2);
    border-radius: 12px;
    overflow: hidden;
  }
  .thumb video {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    background: #000;
  }
  .card.missing .thumb video { display: none; }

  .missing-msg {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--text-faint);
    text-align: center;
    padding: 10px;
  }
  .card.missing .missing-msg { display: flex; }
  .missing-msg svg { width: 28px; height: 28px; }
  .missing-msg span { font-size: 12px; line-height: 1.5; }
  .missing-msg code { color: var(--text-dim); }
  .missing-msg button {
    margin-top: 2px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 14px;
    cursor: pointer;
  }
  .missing-msg button:hover { color: var(--text); border-color: var(--text-faint); }

  .duration {
    position: absolute;
    right: 6px; bottom: 6px;
    background: rgba(0,0,0,.8);
    color: #fff;
    font-size: 12px;
    font-weight: 500;
    padding: 2px 5px;
    border-radius: 4px;
  }
  .card.missing .duration { display: none; }

  .info { display: flex; gap: 12px; margin-top: 12px; }
  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    flex: none;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .info .text { min-width: 0; flex: 1; }
  .title {
    font-size: 14.5px;
    font-weight: 500;
    line-height: 1.35;
    margin: 0;
    outline: none;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .title:focus { text-decoration: underline; text-decoration-color: var(--text-faint); }
  .channel { margin: 4px 0 0; font-size: 13px; color: var(--text-dim); }
  .stats { margin: 2px 0 0; font-size: 13px; color: var(--text-faint); }

  .menu-wrap { position: relative; flex: none; }
  .dots {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }
  .dots:hover { background: var(--hover); color: var(--text); }
  .menu {
    position: absolute;
    right: 0; top: 36px;
    background: #282828;
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
    overflow: hidden;
    min-width: 160px;
    z-index: 25;
  }
  .menu button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 11px 16px;
    background: none;
    border: none;
    color: var(--text);
    font-size: 13.5px;
    cursor: pointer;
  }
  .menu button:hover { background: var(--hover); }

  @media (max-width: 850px) {
    .sidebar {
      position: fixed;
      left: 0;
      top: calc(var(--topbar-h) + env(safe-area-inset-top, 0px));
      width: 260px;
      transform: translateX(-100%);
      background: var(--surface);
      box-shadow: 4px 0 16px rgba(0,0,0,.4);
    }
    .body-wrap.open .sidebar { transform: translateX(0); }
    .body-wrap.open .backdrop { display: block; }
    .body-wrap.collapsed .sidebar { width: 260px; }
    .body-wrap.collapsed .nav-item { flex-direction: row; font-size: 14px; padding: 10px 12px; }
    .logo span.wordmark { display: none; }
    .search { max-width: none; }
  }
  @media (max-width: 480px) {
    .topbar { padding: 0 10px; gap: 8px; }
    .grid { grid-template-columns: 1fr; }
    main { padding: 20px 14px 50px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="left">
    <button class="icon-btn" id="menuBtn" aria-label="Menú">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="logo">
      <span class="play"><svg viewBox="0 0 10 10"><polygon points="0,0 10,5 0,10"/></svg></span>
      <span class="wordmark">PlayRoom</span>
    </div>
  </div>

  <div class="center">
    <form class="search" onsubmit="return false;">
      <input id="searchInput" type="text" placeholder="Buscar en tus videos" autocomplete="off">
      <button type="submit" class="search-btn" aria-label="Buscar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </form>
  </div>

  <div class="right">
    <button class="icon-btn" title="Notificaciones">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
    </button>
    <div class="avatar-me">TÚ</div>
  </div>
</header>

<div class="body-wrap" id="bodyWrap">
  <div class="backdrop" id="backdrop"></div>
  <nav class="sidebar" id="sidebar">
    <button class="nav-item active" data-nav>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span>Inicio</span>
    </button>
    <button class="nav-item" data-nav>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="4"/><path d="M12 9v6M9.5 11l2.5-2 2.5 2"/></svg>
      <span>Shorts</span>
    </button>
    <button class="nav-item" data-nav>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="4 3 20 12 4 21 4 3"/></svg>
      <span>Suscripciones</span>
    </button>
    <hr>
    <button class="nav-item" data-nav>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/></svg>
      <span>Biblioteca</span>
    </button>
    <button class="nav-item" data-nav>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <span>Historial</span>
    </button>
  </nav>

  <main>
    <h1 class="page-title">Inicio</h1>
    <p class="page-sub">Videos cargados desde <code>video1.mp4</code> a <code>video10.mp4</code>, en esta misma carpeta.</p>
    <div class="grid" id="grid"></div>
    <p class="empty-search" id="emptySearch" hidden>No se encontraron videos con ese título.</p>
  </main>
</div>

<script>
(function () {
  const TOTAL = 10;
  const grid = document.getElementById('grid');
  const searchInput = document.getElementById('searchInput');
  const emptySearch = document.getElementById('emptySearch');
  const menuBtn = document.getElementById('menuBtn');
  const bodyWrap = document.getElementById('bodyWrap');
  const backdrop = document.getElementById('backdrop');
  const isNarrow = () => window.matchMedia('(max-width: 850px)').matches;

  const COLORS = ['#ff6d3b','#3ea6ff','#00c48c','#ffb300','#b388ff','#ff5c8a','#26c6da','#ec407a','#9ccc65','#7e57c2'];

  function fmtTime(sec) {
    if (!isFinite(sec)) return '';
    sec = Math.round(sec);
    return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  }
  function closeAllMenus(except) {
    document.querySelectorAll('.menu').forEach(m => { if (m !== except) m.hidden = true; });
  }

  function buildCard(index) {
    const n = index + 1;
    const fileName = `video${n}.mp4`;
    const card = document.createElement('article');
    card.className = 'card';
    card.style.animationDelay = (index * 0.04) + 's';
    card.dataset.title = `video ${n}`;

    card.innerHTML = `
      <div class="thumb">
        <video controls preload="metadata" src="${fileName}"></video>
        <span class="duration" hidden></span>
        <div class="missing-msg">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
          <span>No se encontró <code>${fileName}</code><br>en esta carpeta</span>
          <button type="button" class="retry">Reintentar</button>
        </div>
      </div>
      <div class="info">
        <div class="avatar" style="background:${COLORS[index % COLORS.length]}">${n}</div>
        <div class="text">
          <h3 class="title" contenteditable="true" spellcheck="false">Video ${n}</h3>
          <p class="channel">Tú</p>
          <p class="stats">${fileName}</p>
        </div>
        <div class="menu-wrap">
          <button class="dots" aria-label="Más opciones">&#8942;</button>
          <div class="menu" hidden>
            <button data-action="retry">Recargar archivo</button>
          </div>
        </div>
      </div>
    `;

    const video = card.querySelector('video');
    const durationEl = card.querySelector('.duration');
    const retryBtn = card.querySelector('.retry');
    const titleEl = card.querySelector('.title');
    const dots = card.querySelector('.dots');
    const menu = card.querySelector('.menu');

    video.addEventListener('loadedmetadata', () => {
      durationEl.hidden = false;
      durationEl.textContent = fmtTime(video.duration);
      card.classList.remove('missing');
    });
    video.addEventListener('error', () => card.classList.add('missing'));

    function reload() {
      card.classList.remove('missing');
      video.load();
    }
    retryBtn.addEventListener('click', reload);

    dots.addEventListener('click', e => {
      e.stopPropagation();
      const willOpen = menu.hidden;
      closeAllMenus();
      menu.hidden = !willOpen;
    });
    menu.addEventListener('click', e => {
      if (e.target.dataset.action === 'retry') reload();
      menu.hidden = true;
    });

    titleEl.addEventListener('blur', () => {
      if (!titleEl.textContent.trim()) titleEl.textContent = `Video ${n}`;
    });
    titleEl.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); titleEl.blur(); }
    });
    titleEl.addEventListener('input', () => {
      card.dataset.title = titleEl.textContent.trim().toLowerCase();
    });

    return card;
  }

  for (let i = 0; i < TOTAL; i++) grid.appendChild(buildCard(i));

  document.addEventListener('click', e => {
    if (!e.target.closest('.menu-wrap')) closeAllMenus();
  });

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    let visible = 0;
    grid.querySelectorAll('.card').forEach(card => {
      const match = !q || card.dataset.title.includes(q);
      card.style.display = match ? '' : 'none';
      if (match) visible++;
    });
    emptySearch.hidden = visible !== 0;
  });

  menuBtn.addEventListener('click', () => {
    if (isNarrow()) bodyWrap.classList.toggle('open');
    else bodyWrap.classList.toggle('collapsed');
  });
  backdrop.addEventListener('click', () => bodyWrap.classList.remove('open'));

  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (isNarrow()) bodyWrap.classList.remove('open');
    });
  });
})();
</script>

</body>
</html>
